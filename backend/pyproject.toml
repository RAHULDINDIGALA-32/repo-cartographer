[project]
name = "repo-cartographer-backend"
version = "0.1.0"
description = "Onboard to unfamiliar code in minutes, not days, with answers you can verify."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pathspec>=1.1.1",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.0",
    "sse-starlette>=3.5.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.21.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
cartographer = "app.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: requires live provider credentials and network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_b0_schema_constraints.py" = ["E501", "B017"]
"app/cli.py" = ["E501", "E702"]
"app/ingestion/chunkers/*.py" = ["E501"]
"app/ingestion/*.py" = ["E501"]
"app/providers/*.py" = ["E501"]
"tests/test_b3_primitives.py" = ["E501"]
"tests/test_b3_writer.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
