services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cartographer
      POSTGRES_PASSWORD: cartographer
      POSTGRES_DB: cartographer
    ports: ["55432:5432"]
    volumes:
      - cartographer_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartographer -d cartographer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cartographer_pgdata:
