name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cartographer
          POSTGRES_PASSWORD: cartographer
          POSTGRES_DB: cartographer
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cartographer -d cartographer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - name: Create test database
        run: >-
          uv run python -c 'import psycopg; c=psycopg.connect("postgresql://cartographer:cartographer@localhost:55432/cartographer", autocommit=True); exists=c.execute("SELECT 1 FROM pg_database WHERE datname=$$cartographer_test$$").fetchone(); c.execute("CREATE DATABASE cartographer_test") if not exists else None; c.close()'
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql://cartographer:cartographer@localhost:55432/cartographer
          TEST_DATABASE_URL: postgresql://cartographer:cartographer@localhost:55432/cartographer_test
      - run: uv run cartographer eval validate --path ../eval/questions.yaml
      - run: docker build -t repo-cartographer:ci .
        working-directory: ..
